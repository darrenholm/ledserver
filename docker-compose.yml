services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novastar}
      POSTGRES_USER: ${POSTGRES_USER:-novastar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novastar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novastar} -d ${POSTGRES_DB:-novastar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      IP_WHITELIST: ${IP_WHITELIST}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      COEX_DEFAULT_PORT: ${COEX_DEFAULT_PORT:-5000}
      COEX_TIMEOUT_MS: ${COEX_TIMEOUT_MS:-5000}
      COEX_RETRIES: ${COEX_RETRIES:-2}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-novastar}
      POSTGRES_USER: ${POSTGRES_USER:-novastar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novastar}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://nginx/media}
      MIGRATE_ON_BOOT: "1"
    volumes:
      - ./media:/app/media
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/usr/share/nginx/media:ro

volumes:
  postgres_data:
